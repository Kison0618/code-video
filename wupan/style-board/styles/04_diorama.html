<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:radial-gradient(ellipse at 50% 25%,#34386a 0%,#1f2245 55%,#11132b 100%)}
#tilt{z-index:2;filter:blur(7px);-webkit-mask:linear-gradient(#000 0%,transparent 12%,transparent 80%,#000 100%)}
.sub{color:#fff3e0;font:700 60px "Noto Sans SC";letter-spacing:3px;text-shadow:0 4px 20px rgba(0,0,0,.7)}
</style></head><body><canvas id="tilt" width="1920" height="1080"></canvas><div class="sub">第一个数字，偷偷改写了你的判断</div>
<script src="../assets/three.min.js"></script><script src="scene.js"></script><script>
(async()=>{await WP.fonts();const T=THREE,scene=new T.Scene();
const std=(c,o)=>new T.MeshStandardMaterial({color:c,roughness:.8,...(o||{})});
const add=(geo,mat,x,y,z,p)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m};
// 街区小岛
add(new T.BoxGeometry(14,.3,10),std('#4a4f5c'),0,-.15,0);add(new T.BoxGeometry(14,.12,4),std('#bdb5a8'),0,.06,-3);
add(new T.BoxGeometry(14,2,10),std('#5e4433'),0,-1.3,0);
// 店：暖光橱窗是唯一的大光源
const shop=new T.Group();shop.position.set(0,0,-5.2);scene.add(shop);
add(new T.BoxGeometry(10,4.4,1.6),std('#cbb898'),0,2.2,0,shop);
add(new T.BoxGeometry(5.6,2.5,.1),new T.MeshStandardMaterial({color:'#ffe2a8',emissive:'#ffb85c',emissiveIntensity:1.4}),-1.6,1.55,.82,shop);
for(let i=0;i<4;i++)add(new T.BoxGeometry(.7,1.3,.3),std(['#2c3550','#7a2e2e','#e8e0d0','#3a4a3a'][i]),-3.4+i*1.2,1.2,.6,shop);
for(let i=0;i<7;i++){const s=add(new T.BoxGeometry(.9,.1,1.3),std(i%2?'#efe6d6':'#b8362e'),-4.3+i*.9,3.05,1.35,shop);s.rotation.x=.38}
add(new T.BoxGeometry(1.3,2.5,.1),std('#3b2a20'),2.9,1.25,.82,shop);
const wl=new T.PointLight('#ffb35c',40,11,1.4);wl.position.set(-1.6,1.8,-2.8);scene.add(wl);
// 主角：巨型价签悬在店门上方，被一束聚光打亮
const tex=WP.tagTexture(T,{paper:'#fff7e8',ink:'#232634',accent:'#d6402e'});
const tg=new T.Group();tg.position.set(1.2,6.4,-3.6);tg.rotation.set(0,-.18,.05);scene.add(tg);
add(new T.BoxGeometry(3.4,5.2,.06),std('#fff7e8'),0,0,0,tg);add(new T.PlaneGeometry(3.4,5.2),new T.MeshStandardMaterial({map:tex,roughness:.9}),0,0,.035,tg);
add(new T.CylinderGeometry(.018,.018,8),std('#ccc'),0,6.6,0,tg);
const sp=new T.SpotLight('#fff1d6',120,30,.32,.5,1.2);sp.position.set(6,13,6);sp.target=tg;sp.castShadow=true;scene.add(sp);
// 隔离栏：一排立柱，锚链在立柱之间下垂；第一根链从价签底部垂下来
const posts=[[2.9,-3.6],[3.4,-2.0],[3.0,-.4],[2.2,1.0],[1.0,2.2],[-.4,3.1]];const pm=std('#c9a24a',{metalness:.8,roughness:.3});
posts.forEach(([x,z])=>{add(new T.CylinderGeometry(.06,.06,1.0,12),pm,x,.55,z);add(new T.CylinderGeometry(.28,.3,.06,20),pm,x,.06,z);add(new T.SphereGeometry(.09,12,12),pm,x,1.08,z)});
const cm=std('#2b2e3a',{metalness:.7,roughness:.35}),lg=new T.TorusGeometry(.06,.018,6,10);lg.scale(1,1.6,1);
const chain=pts=>{const cv=new T.CatmullRomCurve3(pts);const N=Math.floor(cv.getLength()/.12);for(let i=0;i<N;i++){const t=i/N,l=add(lg,cm,0,0,0);l.position.copy(cv.getPointAt(t));l.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),cv.getTangentAt(t));l.rotateY(i%2?Math.PI/2:0)}};
scene.updateMatrixWorld(true);const p0=new T.Vector3(0,-2.6,.04);tg.localToWorld(p0);
chain([p0,new T.Vector3(2.6,2.2,-3.4),new T.Vector3(posts[0][0],1.05,posts[0][1])]);
for(let i=0;i<posts.length-1;i++){const[a,b]=[posts[i],posts[i+1]];chain([new T.Vector3(a[0],1.02,a[1]),new T.Vector3((a[0]+b[0])/2,.62,(a[1]+b[1])/2),new T.Vector3(b[0],1.02,b[1])])}
// 链尾：拖到地上，接一只锚
const L=posts[posts.length-1];chain([new T.Vector3(L[0],1.02,L[1]),new T.Vector3(L[0]-.6,.1,L[1]+.4),new T.Vector3(-1.6,.12,3.5)]);
const an=new T.Group();an.position.set(-2.1,.05,3.6);an.rotation.set(-Math.PI/2+.15,0,.9);scene.add(an);const am=std('#2b2e3a',{metalness:.7,roughness:.35});
add(new T.CylinderGeometry(.07,.08,1.3,14),am,0,.7,0,an);add(new T.TorusGeometry(.14,.04,8,20),am,0,1.45,0,an);add(new T.CylinderGeometry(.05,.05,.8,10),am,0,1.15,0,an).rotation.z=Math.PI/2;add(new T.TorusGeometry(.5,.07,8,24,Math.PI),am,0,.55,0,an).rotation.z=Math.PI;
// 人：沿栏杆排队；最前景一个人停下仰头
const person=(x,z,ry,c,up)=>{const g=new T.Group();g.position.set(x,.12,z);g.rotation.y=ry;scene.add(g);const m=std(c);
 add(new T.CapsuleGeometry(.17,.34,4,12),m,0,1.3,0,g).scale.set(1.12,1,.75);const h=add(new T.SphereGeometry(.12,16,16),std('#ead0b6'),0,1.74,0,g);if(up)h.position.z=-.03;
 [-1,1].forEach(s=>{add(new T.CapsuleGeometry(.07,.72,4,8),std('#262934'),.1*s,.5,0,g);add(new T.CapsuleGeometry(.05,.46,4,8),m,.24*s,1.2,0,g)});return g};
[[3.9,-2.9,'#3b6ea8'],[4.2,-1.4,'#b8643a'],[3.9,.2,'#5f8257'],[3.2,1.5,'#8a4a7a'],[2.1,2.6,'#c9a43a']].forEach(([x,z,c],i)=>person(x,z,Math.atan2(posts[Math.max(0,i)][0]-x,posts[Math.max(0,i)][1]-z)+Math.PI*0+3.0,c));
const hero=person(-.9,2.4,2.6,'#f1ece2',true);
// 光：夜色天光 + 路灯
scene.add(new T.HemisphereLight('#8e9cf0','#2a2030',.55));WP.sun(T,scene,'#aeb9ff',.9,[-8,14,8],12);
add(new T.CylinderGeometry(.05,.07,3,8),std('#20232c'),-5.6,1.5,-2.6);add(new T.SphereGeometry(.2,14,14),new T.MeshStandardMaterial({color:'#fff',emissive:'#ffd38a',emissiveIntensity:2}),-5.6,3.05,-2.6);
const ll=new T.PointLight('#ffcf8a',8,7,1.5);ll.position.set(-5.6,2.8,-2.6);scene.add(ll);
const cam=new T.PerspectiveCamera(34,16/9,.1,200);cam.position.set(12,9.5,19);cam.lookAt(.2,3.3,-.6);
const r=WP.renderer(T,1920,1080,{alpha:true});r.setClearColor(0,0);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;document.body.prepend(r.domElement);r.render(scene,cam);
document.getElementById('tilt').getContext('2d').drawImage(r.domElement,0,0);})();
</script></body></html>
