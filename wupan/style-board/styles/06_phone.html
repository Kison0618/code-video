<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#000}
.bg{position:absolute;inset:-40px;background:url() center/cover;filter:blur(18px) brightness(.45) saturate(.8)}
.stage{position:absolute;inset:0;perspective:2200px;z-index:2}
.phone{position:absolute;left:740px;top:70px;width:440px;height:900px;border-radius:64px;background:#111;padding:16px;
 transform:rotateY(-16deg) rotateX(6deg) rotateZ(4deg);box-shadow:30px 60px 90px rgba(0,0,0,.7),inset 0 0 0 3px #3a3a3e,inset 0 0 0 6px #18181b}
.scr{width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f6;position:relative;font-family:"Noto Sans SC"}
.isl{position:absolute;left:50%;top:14px;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:3}
.pic{height:430px;background:url() 78% 60%/220% no-repeat}
.info{padding:22px 26px}
.row{display:flex;align-items:baseline;gap:14px}
.now{font:800 76px Bahnschrift;color:#ff2d3a;letter-spacing:-1px}.now small{font-size:36px}
.was{font:400 30px Bahnschrift;color:#999;text-decoration:line-through}
.tagl{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:8px;background:#ffe9ea;color:#ff2d3a;font-size:22px;font-weight:700}
.name{margin-top:14px;font-size:26px;color:#222;font-weight:500}
.cd{margin-top:16px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#ff2d3a,#ff7a2d);color:#fff;font-size:22px;display:flex;justify-content:space-between}
.btn{position:absolute;left:22px;right:22px;bottom:30px;height:84px;border-radius:42px;background:#ff2d3a;color:#fff;font:700 32px "Noto Sans SC";display:flex;align-items:center;justify-content:center}
.tap{position:absolute;left:50%;bottom:52px;width:120px;height:120px;margin-left:-20px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 0 0 18px rgba(255,255,255,.25)}
.sub{color:#fff;font:500 58px "Noto Sans SC";letter-spacing:4px;text-shadow:0 2px 16px #000}
</style></head><body><div class="bg" id="bg"></div>
<div class="stage"><div class="phone"><div class="scr"><div class="isl"></div>
 <div class="pic" id="pic"></div>
 <div class="info"><div class="row"><div class="now"><small>¥</small>3,999</div><div class="was">¥9,999</div></div>
 <div class="tagl">限时直降 ¥6,000</div><div class="name">意式羊毛双面呢大衣 · 秋冬新款</div>
 <div class="cd"><span>距结束</span><b>00 : 09 : 59</b></div></div>
 <div class="btn">立即购买</div><div class="tap"></div></div></div></div>
<div class="sub">第一个数字，偷偷改写了你的判断</div>
<script src="../assets/img_photo_tag.js"></script><script src="../assets/img_photo_window.js"></script><script>
document.getElementById('pic').style.backgroundImage=`url(${IMG.photo_tag})`;document.getElementById('bg').style.backgroundImage=`url(${IMG.photo_window})`;
</script></body></html>
