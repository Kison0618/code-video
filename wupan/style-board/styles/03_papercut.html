<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#1d3b4f}
svg{position:absolute;inset:0}
.sub{color:#fff8ec;font:700 60px "Noto Sans SC";letter-spacing:4px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#grain{position:absolute;inset:0;z-index:4;opacity:.12;mix-blend-mode:multiply}
</style></head><body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0b1a24" flood-opacity=".45"/></filter>
 <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0b1a24" flood-opacity=".4"/></filter>
</defs>
<!-- 天空纸层 -->
<rect width="1920" height="1080" fill="#244a63"/>
<circle cx="1560" cy="230" r="110" fill="#f6e7c8" filter="url(#sh)"/>
<path d="M0 520 C 300 440 520 560 820 500 S 1400 420 1920 500 V1080 H0Z" fill="#2f5d78" filter="url(#sh)"/>
<path d="M0 640 C 260 580 560 680 900 620 S 1500 560 1920 640 V1080 H0Z" fill="#3c7290" filter="url(#sh)"/>
<!-- 价签：从画面顶部垂下 -->
<line x1="980" y1="0" x2="980" y2="112" stroke="#f6e7c8" stroke-width="5"/>
<g filter="url(#sh)" transform="rotate(4 980 110)">
 <path d="M860 160 L980 100 L1100 160 V620 H860Z" fill="#fbf1de"/>
 <circle cx="980" cy="150" r="16" fill="#3c7290"/>
 <text x="980" y="260" text-anchor="middle" font-family="Noto Sans SC" font-size="30" fill="#2a3a46">原价</text>
 <text x="980" y="340" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-size="76" fill="#2a3a46">¥9,999</text>
 <rect x="872" y="305" width="216" height="9" fill="#e2553b" transform="rotate(-7 980 310)"/>
 <text x="980" y="440" text-anchor="middle" font-family="Noto Sans SC" font-size="30" fill="#e2553b">现价</text>
 <text x="980" y="540" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-size="96" fill="#e2553b">¥3,999</text>
</g>
<!-- 链：一串纸圈 -->
<g fill="none" stroke="#f6e7c8" stroke-width="7" filter="url(#sh2)">
 <ellipse cx="1010" cy="660" rx="13" ry="24"/><ellipse cx="1022" cy="702" rx="20" ry="11"/><ellipse cx="1040" cy="742" rx="13" ry="24"/><ellipse cx="1062" cy="780" rx="20" ry="11"/>
 <ellipse cx="1090" cy="814" rx="13" ry="24" transform="rotate(-20 1090 814)"/><ellipse cx="1126" cy="840" rx="22" ry="11"/><ellipse cx="1168" cy="852" rx="13" ry="24" transform="rotate(-60 1168 852)"/><ellipse cx="1214" cy="850" rx="22" ry="11"/>
</g>
<!-- 前景地面层 -->
<path d="M0 800 C 400 740 800 830 1200 790 S 1700 760 1920 800 V1080 H0Z" fill="#e9c98f" filter="url(#sh)"/>
<!-- 锚：红纸剪，斜插在地里 -->
<g filter="url(#sh)" transform="rotate(-14 1330 820)" fill="#e2553b">
 <path d="M1314 600 h32 v290 h-32z"/>
 <circle cx="1330" cy="578" r="34" fill="none" stroke="#e2553b" stroke-width="18"/>
 <rect x="1250" y="650" width="160" height="26" rx="13"/>
 <path d="M1190 820 Q1330 990 1470 820 L1500 760 L1440 800 Q1330 920 1220 800 L1160 760Z"/>
</g>
<path d="M0 900 C 500 860 900 930 1300 890 S 1750 870 1920 900 V1080 H0Z" fill="#d9b276" filter="url(#sh)"/>
<!-- 人：背影剪影 -->
<g filter="url(#sh)" fill="#1d3b4f">
 <circle cx="640" cy="636" r="30"/>
 <path d="M596 676 Q640 662 684 676 L700 790 L686 792 L676 720 L672 800 L660 900 L644 900 L640 812 L636 900 L620 900 L608 800 L604 720 L594 792 L580 790Z"/>
</g>
</svg>
<canvas id="grain" width="1920" height="1080"></canvas>
<div class="sub">第一个数字，偷偷改写了你的判断</div>
<script>
const g=document.getElementById('grain').getContext('2d'),d=g.createImageData(1920,1080);
for(let i=0;i<d.data.length;i+=4){const v=200+Math.random()*55;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);
</script></body></html>
