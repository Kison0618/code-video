<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#000}
.ph{position:absolute;left:0;top:-160px;width:1920px;height:1280px;background:center/cover}
.pg{position:absolute;z-index:1;color:#2b2420;font-family:"Noto Serif SC";mix-blend-mode:multiply}
.pg h3{margin:0 0 6px;font:400 20px Georgia;letter-spacing:8px;color:#7a6a58;text-align:center}
.pg h4{margin:0 0 26px;font:700 34px "Noto Serif SC";letter-spacing:10px;text-align:center}
.it{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 22px;font-size:26px}
.it span{flex:1;border-bottom:2px dotted #b9ab98;margin:0 10px;transform:translateY(-6px)}
.it b{font:600 28px Georgia}
.it small{display:block;font-size:17px;color:#8a7a68;margin-top:2px}
.heat{position:absolute;inset:0;z-index:2;mix-blend-mode:multiply;opacity:.55}
svg{position:absolute;inset:0;z-index:3}
.lab{position:absolute;z-index:4;font:500 22px Consolas,"Noto Sans SC";color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border:1.5px solid rgba(255,255,255,.6)}
.hud{position:absolute;inset:30px;z-index:4;font:400 20px Consolas;color:rgba(255,255,255,.85)}
.hud span{position:absolute}
.sub{color:#fff;font:600 58px "Noto Sans SC";letter-spacing:3px;text-shadow:0 3px 16px #000}
</style></head><body><div class="ph" id="ph"></div>
