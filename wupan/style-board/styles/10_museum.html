<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#000}
.ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:center/cover}
.cone{position:absolute;inset:0;z-index:1;background:conic-gradient(from 170deg at 50% -6%,transparent 0deg,rgba(255,244,220,.12) 8deg,rgba(255,244,220,.18) 10deg,rgba(255,244,220,.12) 12deg,transparent 20deg);mix-blend-mode:screen}
.card{position:absolute;left:1214px;top:822px;width:150px;height:84px;z-index:2;transform:perspective(600px) rotateX(38deg);text-align:center;color:#222;font:600 13px/1.35 Georgia}
.card b{display:block;font:700 18px Georgia;color:#7a1e14}
.panel{position:absolute;left:1430px;top:170px;width:400px;z-index:2;padding:30px 32px 26px;background:#f1ece2;color:#1d1d1d;box-shadow:0 22px 50px rgba(0,0,0,.6);transform:perspective(1300px) rotateY(-16deg)}
.panel small{display:block;font:400 17px Georgia;letter-spacing:6px;color:#777}
.panel h2{margin:10px 0 4px;font:700 40px "Noto Serif SC";letter-spacing:3px}
.panel i{display:block;font:italic 20px Georgia;color:#555}
.panel hr{border:0;border-top:1.5px solid #1d1d1d;margin:16px 0}
.panel .est{font:400 18px "Noto Serif SC";color:#555;letter-spacing:4px}
.panel .num{font:700 40px Georgia;color:#7a1e14;letter-spacing:1px;margin:2px 0 10px}
.panel p{margin:0;font:400 20px/1.7 "Noto Serif SC";color:#333}
.sub{color:#fff;font:400 58px "Noto Serif SC";letter-spacing:6px;text-shadow:0 3px 16px #000}
</style></head><body><div class="ph" id="ph"></div><div class="cone"></div>
<div class="card">LOT 103<b>估 ¥8,000,000+</b></div>
<div class="panel"><small>LOT 103 · 预展</small><h2>青花缠枝纹瓶</h2><i>Qing Dynasty, 18th c.</i><hr>
<div class="est">估价 ESTIMATE</div><div class="num">¥8,000,000 – 12,000,000</div>
<p>估价不是价格。可是举牌的人，几乎都从这个数字开始往上加。</p></div>
<div class="sub">第一个数字，偷偷改写了你的判断</div>
<script src="../assets/img_photo_auction.js"></script><script>document.getElementById('ph').style.backgroundImage=`url(${IMG.photo_auction})`</script>
</body></html>
