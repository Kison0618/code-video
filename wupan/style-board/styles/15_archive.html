<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#0b0906}
.sub{color:#fff4dc;font:500 56px "Noto Serif SC";letter-spacing:6px;text-shadow:0 2px 10px #000}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><div class="sub">第一个数字，偷偷改写了你的判断</div>
<script src="../assets/img_photo_tvshow.js"></script><script>
(async()=>{await document.fonts.load('700 40px Bahnschrift');await document.fonts.load('900 40px "Noto Sans SC"');await document.fonts.load('700 40px Rockwell');
const img=new Image();img.src=IMG.photo_tvshow;await img.decode();
const W=1920,H=1080,c=document.getElementById('c').getContext('2d',{willReadFrequently:true});let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;
c.drawImage(img,0,-40,1920,1280);
// 点阵记分牌：先把字画在小画布上，再逐点点亮灯泡
function dots(lines,x0,y0,w,h,pitch){const cols=Math.floor(w/pitch),rows=Math.floor(h/pitch),o=document.createElement('canvas');o.width=cols;o.height=rows;const g=o.getContext('2d',{willReadFrequently:true});
 g.fillStyle='#000';g.fillRect(0,0,cols,rows);lines.forEach(([t,f,y,col])=>{g.font=f;g.textAlign='center';g.fillStyle=col;g.fillText(t,cols/2,y)});const d=g.getImageData(0,0,cols,rows).data;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=(j*cols+i)*4,on=d[k]+d[k+1]+d[k+2]>200;const X=x0+i*pitch+pitch/2,Y=y0+j*pitch+pitch/2;
  c.fillStyle=on?`rgb(${d[k]},${d[k+1]},${d[k+2]})`:'rgba(40,24,10,.85)';if(on){c.shadowColor=`rgb(${d[k]},${d[k+1]},${d[k+2]})`;c.shadowBlur=8}else c.shadowBlur=0;
  c.beginPath();c.arc(X,Y,pitch*.38,0,7);c.fill()}c.shadowBlur=0}
c.fillStyle='#1a0e06';c.fillRect(1005,92,840,376);
dots([['上一位出价','700 9px "Noto Sans SC"',9,'#ffb347'],['¥9,999','700 17px Bahnschrift',27,'#ffe08a']],1005,92,840,376,12.4);
// 选手讲台上的出价
c.save();c.translate(332,822);c.fillStyle='#ffe9c2';c.font='700 66px Rockwell';c.textAlign='center';c.textBaseline='middle';c.shadowColor='#ffb347';c.shadowBlur=14;c.fillText('7,500',0,0);c.restore();
// 70 年代电视字幕条
c.save();c.translate(120,96);c.fillStyle='#e5512b';c.beginPath();c.roundRect(0,0,520,74,37);c.fill();c.fillStyle='#ffe9c2';c.font='900 40px "Noto Sans SC"';c.textBaseline='middle';c.fillText('猜猜它值多少？',36,38);c.restore();
// —— 褪色彩色胶片：偏暖、压暗部、颗粒、光晕、暗角 ——
const im=c.getImageData(0,0,W,H),d=im.data;
for(let i=0;i<d.length;i+=4){const x=(i/4)%W,y=(i/4/W)|0;const n=(Math.random()-.5)*34;const vg=1-.55*Math.pow(Math.hypot((x-W/2)/(W*.6),(y-H/2)/(H*.6)),2.4);
 let r=d[i],g=d[i+1],b=d[i+2];r=r*.92+28;g=g*.86+20;b=b*.72+18;const l=(r+g+b)/3;r=l+(r-l)*.78;g=l+(g-l)*.78;b=l+(b-l)*.78;
 d[i]=Math.max(0,Math.min(255,(r+n)*vg));d[i+1]=Math.max(0,Math.min(255,(g+n)*vg));d[i+2]=Math.max(0,Math.min(255,(b+n)*vg))}
c.putImageData(im,0,0);
c.globalCompositeOperation='screen';c.filter='blur(14px)';c.globalAlpha=.35;c.drawImage(c.canvas,0,0);c.filter='none';c.globalAlpha=1;c.globalCompositeOperation='source-over';
for(let k=0;k<10;k++){c.strokeStyle=R()<.5?'rgba(255,245,220,.35)':'rgba(0,0,0,.35)';c.lineWidth=R()*1.4+.4;const x=R()*W;c.beginPath();c.moveTo(x,0);c.lineTo(x+R()*24-12,H);c.stroke()}
for(let k=0;k<40;k++){c.fillStyle=R()<.5?'rgba(255,240,200,.6)':'rgba(0,0,0,.6)';c.beginPath();c.arc(R()*W,R()*H,R()*2.6+.5,0,7);c.fill()}
// 圆角片门 + 片边信息
c.strokeStyle='#0b0906';c.lineWidth=70;c.beginPath();c.roundRect(-20,-20,W+40,H+40,90);c.stroke();
c.fillStyle='rgba(255,230,190,.75)';c.font='400 20px Consolas';c.fillText('KODAK EKTACHROME · 1976 · TV ARCHIVE',70,H-30);c.textAlign='right';c.fillText('▸ 23',W-70,H-30);
})();
</script></body></html>
