<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EEE5">
<title>查成分 · 方案 B 刊物</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #F2EEE5; --ink: #17322C; --dim: #7C867F; --hair: rgba(23,50,44,.22); --acc: #C8742A; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', sans-serif; }
  .page { max-width: 480px; min-height: 100dvh; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--ink); font-size: 11.5px; letter-spacing: .16em; }
  header b { font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: 16px; letter-spacing: .1em; }
  header span { color: var(--dim); }
  .lead { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 26px 0 22px; }
  .kicker { font-family: 'CF Latin', Georgia, serif; font-style: italic; font-size: 19px; color: var(--acc); margin-bottom: 14px; }
  h1 { font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: clamp(60px, 19.5vw, 88px); line-height: 1.04; letter-spacing: -.02em; margin-left: -3px; }
  h1 em { font-style: normal; color: var(--acc); }
  .eg { margin-top: 26px; font-size: 15px; color: var(--dim); display: flex; align-items: baseline; gap: 10px; min-height: 34px; }
  .eg b { font-family: 'CF Serif', 'Songti SC', serif; font-weight: 500; font-size: 21px; color: var(--ink); border-bottom: 1.5px solid var(--acc); padding-bottom: 2px; transition: opacity .45s; white-space: nowrap; }
  .eg b.hide { opacity: 0; }
  dl { border-top: 1px solid var(--ink); }
  dl div { display: grid; grid-template-columns: 78px 1fr; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--hair); }
  dt { font-family: 'CF Latin', Georgia, serif; font-size: 34px; line-height: 1; }
  dd { font-size: 14px; line-height: 1.45; }
  dd small { display: block; color: var(--dim); font-size: 12px; margin-top: 1px; }
  .cta { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; height: 62px; padding: 0 24px; background: var(--ink); color: var(--bg); text-decoration: none; border-radius: 4px; transition: transform .15s; }
  .cta:active { transform: scale(.98); }
  .cta b { font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: 21px; letter-spacing: .12em; }
  .cta span { font-size: 13px; opacity: .7; }
  .src { margin-top: 12px; font-size: 11px; color: var(--dim); line-height: 1.6; }
</style>
</head>
<body>
<div class="page">
  <header><b>查成分</b><span>性格成分检测</span></header>

  <div class="lead">
    <p class="kicker">What are you made of?</p>
    <h1>你，<br>是什么<br><em>做的</em>？</h1>
    <p class="eg"><span>比如</span><b id="eg"></b></p>
  </div>

  <dl>
    <div><dt>213</dt><dd>道题<small>心理学界公开使用的 IPIP-VIA 量表</small></dd></div>
    <div><dt>24</dt><dd>种性格成分<small>出自 Peterson 与 Seligman 的性格优势分类</small></dd></div>
    <div><dt>552</dt><dd>种结果<small>看你最多的和最少的，放在一起是什么人</small></dd></div>
  </dl>

  <a class="cta" href="../index.html"><b>开始</b><span>约 8 分钟　→</span></a>
  <p class="src">不用注册，答案只在你的手机里计算。非官方测评，仅供娱乐。</p>
</div>

<script src="../js/data.js"></script>
<script>
(() => {
  const S = STRENGTHS, el = document.getElementById('eg');
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function next() {
    const a = S[Math.floor(rnd() * 24)]; let b; do { b = S[Math.floor(rnd() * 24)]; } while (b === a || b.key === 'spirituality' || (b.mod + a.noun).length > 11);
    el.classList.add('hide'); setTimeout(() => { el.textContent = b.mod + a.noun; el.classList.remove('hide'); }, 450);
  }
  next(); setInterval(next, 2600);
})();
</script>
</body>
</html>
