<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE7FF">
<title>查成分 · 方案 C 卡片</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --ink: #16131F; --dim: #5F5A70; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { color: var(--ink); font-family: -apple-system, 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', sans-serif; background: #EDE7FF; overflow: hidden; }
  .bg { position: fixed; inset: -10%; background:
      radial-gradient(42% 34% at 18% 16%, #FFD9C2 0, transparent 70%),
      radial-gradient(46% 36% at 88% 30%, #C9D6FF 0, transparent 70%),
      radial-gradient(50% 40% at 30% 92%, #C8F3DF 0, transparent 70%),
      radial-gradient(44% 36% at 92% 88%, #FFD0EA 0, transparent 70%), #EFEAFB; }
  .page { position: relative; max-width: 480px; height: 100dvh; min-height: 620px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  header span { font-size: 12px; font-weight: 600; background: rgba(255,255,255,.7); padding: 5px 11px; border-radius: 99px; }
  h1 { margin-top: 20px; font-size: clamp(31px, 9vw, 38px); font-weight: 800; line-height: 1.18; letter-spacing: -.02em; }
  .sub { margin-top: 8px; font-size: 15px; color: var(--dim); line-height: 1.55; }
  .stack { position: relative; flex: 1; min-height: 0; margin: 14px 0 12px; }
  .card { position: absolute; left: 50%; top: 50%; width: min(74vw, 300px); height: min(100%, 408px); background: #fff; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 40px -12px rgba(40,24,90,.28), 0 2px 6px rgba(40,24,90,.08); transition: transform .7s cubic-bezier(.3,1.2,.3,1), opacity .5s; will-change: transform; }
  .card img { width: 100%; flex: 1; min-height: 0; object-fit: cover; display: block; background: #ddd; }
  .card .t { padding: 13px 18px 16px; }
  .card i { font-style: normal; font-size: 13.5px; color: var(--dim); font-weight: 600; }
  .card b { display: block; font-size: 27px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .card .bars { display: grid; gap: 5px; margin-top: 10px; }
  .card .bars span { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--dim); }
  .card .bars u { display: block; height: 6px; border-radius: 9px; background: #EEEAF6; overflow: hidden; }
  .card .bars u::after { content: ''; display: block; height: 100%; width: var(--w); background: var(--c); border-radius: 9px; }
  .card .bars em { font-style: normal; text-align: right; color: var(--ink); }
  .p0 { transform: translate(-50%, -50%) rotate(-2deg); z-index: 3; }
  .p1 { transform: translate(-50%, -50%) translate(16px, 6px) rotate(5deg) scale(.95); z-index: 2; }
  .p2 { transform: translate(-50%, -50%) translate(-18px, 12px) rotate(-8deg) scale(.9); z-index: 1; }
  .out { transform: translate(-50%, -50%) translate(-130%, -6%) rotate(-22deg); opacity: 0; z-index: 4; }
  .chips { display: flex; justify-content: center; gap: 7px; margin-bottom: 14px; }
  .chips span { font-size: 12px; font-weight: 600; background: rgba(255,255,255,.72); padding: 6px 11px; border-radius: 99px; white-space: nowrap; }
  .chips b { font-weight: 800; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; transition: transform .15s; box-shadow: 0 10px 24px -8px rgba(22,19,31,.5); }
  .cta:active { transform: scale(.97); }
  .cta small { font-size: 13px; font-weight: 500; opacity: .65; }
  .src { margin-top: 10px; text-align: center; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <header><b>查成分</b><span>性格成分检测</span></header>
  <h1>测一测，<br>你是什么做的</h1>
  <p class="sub">答完题，领一张属于你的成分卡。</p>

  <div class="stack" id="stack"></div>

  <div class="chips"><span><b>213</b> 题专业量表</span><span><b>24</b> 种成分</span><span><b>552</b> 种结果</span></div>
  <a class="cta" href="../index.html">开始检测 <small>约 8 分钟</small></a>
  <p class="src">题目源自 IPIP-VIA 公开量表 · 无需注册 · 仅供娱乐</p>
</div>

<script src="../js/data.js"></script>
<script>
(() => {
  const S = Object.fromEntries(STRENGTHS.map(s => [s.key, s])), COL = { w: '#5B7CFA', c: '#FF7043', h: '#F25C9E', j: '#22B573', t: '#F0A91E', x: '#8B6BF2' };
  const DECK = [
    ['kindness', 'forgiveness', ['kindness', 92], ['humor', 81], ['forgiveness', 17]],
    ['curiosity', 'perseverance', ['curiosity', 96], ['creativity', 84], ['perseverance', 21]],
    ['humor', 'social', ['humor', 94], ['zest', 77], ['social', 24]],
    ['perseverance', 'zest', ['perseverance', 95], ['selfreg', 86], ['zest', 19]],
    ['beauty', 'selfreg', ['beauty', 91], ['love', 79], ['selfreg', 22]],
    ['judgment', 'bravery', ['judgment', 93], ['prudence', 85], ['bravery', 18]]
  ];
  const stack = document.getElementById('stack');
  const cards = DECK.map(([a, b, ...bars]) => {
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<img src="../img/${a}.webp" alt=""><div class="t"><i>${S[b].mod}</i><b>${S[a].noun}</b><div class="bars">${bars.map(([k, n]) => `<span>${S[k].zh}<u style="--w:${n}%;--c:${COL[S[k].v]}"></u><em>${n}%</em></span>`).join('')}</div></div>`;
    stack.append(el); return el;
  });
  let i = 0;
  function lay() { cards.forEach((c, k) => { const p = (k - i + cards.length) % cards.length; c.className = 'card ' + (p < 3 ? 'p' + p : 'p2'); c.style.opacity = p < 3 ? 1 : 0; }); }
  function next() { const cur = cards[i]; cur.className = 'card out'; i = (i + 1) % cards.length; setTimeout(lay, 380); }
  lay(); setInterval(next, 2800);
  stack.addEventListener('click', next);
})();
</script>
</body>
</html>
