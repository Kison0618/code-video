<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B10">
<title>查成分 · 方案 A 光谱</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #0B0B10; --fg: #F4F1EA; --dim: #8C8A96; --hair: rgba(244,241,234,.14); }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', sans-serif; overflow: hidden; }
  .page { position: relative; max-width: 480px; height: 100dvh; min-height: 620px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 38% at 50% 36%, color-mix(in oklab, var(--hue, #7AA2FF) 26%, transparent), transparent 70%); transition: --hue 1.6s; opacity: .9; }
  @property --hue { syntax: '<color>'; inherits: true; initial-value: #7AA2FF; }
  header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .14em; color: var(--dim); position: relative; }
  header b { color: var(--fg); font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: 17px; letter-spacing: .08em; }
  .dial { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; margin: 4px -8px 0; }
  .dial svg { width: min(100%, 52dvh); height: auto; overflow: visible; }
  .spoke { transform-box: view-box; transform-origin: 200px 200px; }
  .spoke rect { transition: height 1.5s cubic-bezier(.3,.9,.2,1), y 1.5s cubic-bezier(.3,.9,.2,1), opacity 1.2s; }
  .spoke text { font-size: 9.5px; fill: var(--dim); transition: fill .8s; letter-spacing: .05em; }
  .spoke.top text { fill: var(--fg); }
  .core { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .core div { transition: opacity .5s, transform .5s; }
  .core .hide { opacity: 0; transform: scale(.96); }
  .core small { display: block; font-size: 11px; letter-spacing: .2em; color: var(--dim); margin-bottom: 6px; }
  .core i { display: block; font-style: normal; font-size: 14px; color: var(--dim); }
  .core b { display: block; font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: clamp(22px, 6.6vw, 28px); line-height: 1.2; }
  h1 { font-family: 'CF Serif', 'Songti SC', serif; font-weight: 900; font-size: clamp(34px, 10.4vw, 44px); line-height: 1.14; letter-spacing: -.01em; position: relative; }
  .sub { margin-top: 10px; color: #B9B6C2; font-size: 15px; line-height: 1.6; position: relative; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 0 16px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); position: relative; }
  .stats div { padding: 11px 0 10px; }
  .stats div + div { border-left: 1px solid var(--hair); padding-left: 14px; }
  .stats b { font-family: 'CF Latin', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1; display: block; }
  .stats span { font-size: 11.5px; color: var(--dim); letter-spacing: .04em; }
  .cta { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 60px; padding: 0 8px 0 26px; border-radius: 99px; background: var(--fg); color: #0B0B10; font-size: 18px; font-weight: 700; text-decoration: none; position: relative; transition: transform .15s; }
  .cta:active { transform: scale(.975); }
  .cta span:last-child { width: 44px; height: 44px; border-radius: 50%; background: #0B0B10; color: var(--fg); display: grid; place-items: center; font-size: 18px; }
  .src { margin-top: 12px; text-align: center; font-size: 11px; color: #6E6C78; letter-spacing: .02em; position: relative; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="glow"></div>
  <header><b>查成分</b><span>性格成分检测</span></header>

  <div class="dial">
    <svg viewBox="0 0 400 400" id="dial" aria-hidden="true">
      <circle cx="200" cy="200" r="78" fill="none" stroke="rgba(244,241,234,.14)"/>
      <circle cx="200" cy="200" r="176" fill="none" stroke="rgba(244,241,234,.07)" stroke-dasharray="1 5"/>
    </svg>
    <div class="core"><div id="core"><small>有人测出来是</small><i id="mod"></i><b id="noun"></b></div></div>
  </div>

  <h1>你是什么<br>做的？</h1>
  <p class="sub">每个人身上都有 24 种性格成分，只是配比不同。测一次，看看你的。</p>
  <div class="stats">
    <div><b>213</b><span>道题的心理学量表</span></div>
    <div><b>24</b><span>种性格成分</span></div>
    <div><b>552</b><span>种可能的结果</span></div>
  </div>
  <a class="cta" href="../index.html"><span>开始检测</span><span>→</span></a>
  <p class="src">题目源自 IPIP-VIA 公开量表 · 约 8 分钟 · 无需注册</p>
</div>

<script src="../js/data.js"></script>
<script>
(() => {
  const S = STRENGTHS, HUE = { w: '#7AA2FF', c: '#FF7A59', h: '#FF8FC7', j: '#5EE0A0', t: '#FFD166', x: '#B79CFF' };
  const svg = document.getElementById('dial'), NS = 'http://www.w3.org/2000/svg';
  const R0 = 86, MAX = 82;
  const spokes = S.map((s, i) => {
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'spoke'); g.style.transform = `rotate(${i * 15}deg)`;
    const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', 196.5); r.setAttribute('width', 7); r.setAttribute('rx', 3.5); r.setAttribute('fill', HUE[s.v]);
    r.setAttribute('y', 200 - R0 - 8); r.setAttribute('height', 8);
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', 200); t.setAttribute('y', 200 - R0 - MAX - 14); t.setAttribute('text-anchor', 'middle'); t.textContent = s.zh;
    if (i > 6 && i < 18) t.setAttribute('transform', `rotate(180 200 ${200 - R0 - MAX - 17.5})`);
    g.append(r, t); svg.append(g); return { g, r };
  });
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const core = document.getElementById('core'), mod = document.getElementById('mod'), noun = document.getElementById('noun'), page = document.getElementById('page');
  function show() {
    const a = Math.floor(rnd() * 24); let b; do { b = Math.floor(rnd() * 24); } while (b === a || S[b].key === 'spirituality');
    spokes.forEach((sp, i) => {
      const v = i === a ? 1 : i === b ? .08 : .22 + rnd() * .55, h = 8 + v * (MAX - 8);
      sp.r.setAttribute('height', h); sp.r.setAttribute('y', 200 - R0 - h); sp.r.style.opacity = i === a ? 1 : i === b ? .35 : .62;
      sp.g.classList.toggle('top', i === a);
    });
    core.classList.add('hide');
    setTimeout(() => { mod.textContent = S[b].mod; noun.textContent = S[a].noun; core.classList.remove('hide'); page.style.setProperty('--hue', HUE[S[a].v]); }, 420);
  }
  show(); setInterval(show, 3200);
})();
</script>
</body>
</html>
