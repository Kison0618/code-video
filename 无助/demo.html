<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ss = (a,b,t) => { const x = clamp((t-a)/(b-a)); return x*x*(3-2*x); };   // smoothstep 0→1
const win = (t,a,b,fi=.4,fo=.4) => ss(a,a+fi,t) * (1 - ss(b-fo,b,t));         // 窗口内为 1
const lerp = (a,b,x) => a + (b-a)*x;

// ---------- 字幕 ----------
const SUBS = [
  [0.5,  '晚上十一点，他投出了**第 30 份**简历。'],
  [3.2,  '一个星期过去，邮箱里，**什么也没有**。'],
  [5.8,  '后来，他连邮箱，**都不点开了**。'],
  [8.4,  '点开，只要**一秒**。'],
  [10.6, '他不是懒。'],
  [12.4, '他只是太多次，**没有听到回音**——'],
  [14.6, '于是心里认定：**做什么，都没用**。'],
  [16.7, ''],
  [22.4, '1965 年，一间实验室里，有人发现了一件怪事。'],
  [25.0, '几只狗，被关在一个箱子里。'],
  [27.4, '中间一道矮栏杆——**跳过去，就不疼了**。'],
  [30.0, '可它们趴在原地，**一动不动**。'],
  [32.4, '别人说：这批狗，坏了。'],
  [34.6, '有人却想：它们是不是，**学会了**放弃？'],
  [36.9, ''],
  [37.4, '他找来三只狗。'],
  [39.4, '第一只：挨电的时候，用头一推，**电就停了**。'],
  [42.4, '第二只：挨一模一样的电，可怎么推，**都停不下来**。'],
  [45.4, '第三只：什么也没挨。'],
  [47.6, '第二天，三只狗被放进同一个箱子。'],
  [50.0, '一号、三号，很快就跳了过去。'],
  [52.4, '二号，**趴下了**。'],
  [54.6, '它挨的疼，一点也不比一号多。'],
  [56.8, '区别只在于，它的经历告诉它——'],
  [59.0, ''],
];
function parse(s) {               // → [{ch, k}]
  const out = []; let k = false;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '*' && s[i+1] === '*') { k = !k; i++; continue; }
    out.push({ ch: s[i], k });
  }
  return out;
}
const PARSED = SUBS.map(([t, s]) => ({ t, chars: parse(s) }));
let lastIdx = -1;
function renderSub(t, el, list, perChar = .075, fadeOut = .28) {
  let idx = -1;
  for (let i = 0; i < list.length; i++) if (list[i].t <= t) idx = i;
  if (idx < 0) { el.innerHTML = ''; return; }
  const cur = list[idx], next = list[idx+1];
  if (el._idx !== idx) {
    el.innerHTML = cur.chars.map(c => `<span class="${c.k ? 'k' : ''}">${c.ch === ' ' ? '&nbsp;' : c.ch}</span>`).join('');
    el._idx = idx;
  }
  const out = next ? 1 - ss(next.t - fadeOut, next.t, t) : 1;
  [...el.children].forEach((sp, i) => {
    const x = ss(cur.t + i*perChar, cur.t + i*perChar + .24, t);
    sp.style.opacity = (x * out).toFixed(3);
    sp.style.filter = x < 1 ? `blur(${((1-x)*7).toFixed(2)}px)` : 'none';
  });
}
// 片名问句单独一行
const Q = [{ t: 18.3, chars: parse('一个人，是怎么**学会放弃**的？') }, { t: 21.9, chars: [] }];

// ---------- 静态装饰 ----------
(function () {
  const d = $('dust'); let s = 7;
  const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) d.insertAdjacentHTML('beforeend', `<circle cx="${(r()*1920)|0}" cy="${(r()*900)|0}" r="${(0.8+r()*1.2).toFixed(1)}" opacity="${(0.15+r()*0.35).toFixed(2)}"/>`);
  const g = $('rings');
  [[230,44],[420,82],[620,122],[860,170],[1120,222]].forEach(([rx,ry],i) =>
    g.insertAdjacentHTML('beforeend', `<ellipse id="ring${i}" cx="960" cy="600" rx="${rx}" ry="${ry}"/>`));
})();
const grain = $('grain').getContext('2d');
const gimg = grain.createImageData(960, 540);
function renderGrain(frame) {
  let s = (frame * 9301 + 49297) % 233280 || 1;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  grain.putImageData(gimg, 0, 0);
}
const setOp = (id, v) => $(id).setAttribute('opacity', clamp(v).toFixed(3));
const use = (id, x, y, sx = 1, sy = 1) => $(id).setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sx} ${sy})`);

// ---------- 主渲染 ----------
window.render = function (t, frame) {
  renderGrain(frame);
  const DROP = 17.05;

  // ===== A：邮箱（0 – 17.05）=====
  const A = t < DROP;
  $('A').style.display = A ? '' : 'none';
  if (A) {
    const push = 1 + 0.06 * ss(9, 17, t);
    $('A').setAttribute('transform', `translate(960 470) scale(${push}) translate(-960 -470)`);
    // 写邮件 → 发送
    const press = win(t, 1.55, 1.85, .1, .15);
    $('sendBtn').setAttribute('transform', `translate(1256 621) scale(${1 - .06*press}) translate(-1256 -621)`);
    const fly = ss(1.9, 2.6, t);
    $('compose').setAttribute('transform', `translate(0 ${-40*fly})`);
    setOp('compose', ss(0, .5, t) * (1 - fly));
    setOp('toast', win(t, 2.0, 3.2, .25, .35));
    // 收件箱
    setOp('inbox', win(t, 3.0, 6.3, .4, .6));
    const day = Math.min(7, 1 + Math.floor(ss(3.4, 5.4, t) * 6.999));
    $('dayTxt').textContent = 'DAY ' + day;
    // 计数
    setOp('counters', ss(.4, 1.0, t) * (1 - ss(10.4, 11.6, t)));
    $('cnt').textContent = t < 1.7 ? '29' : '30';
    setOp('replyCnt', ss(4.6, 5.2, t));
    // 图标
    const iconOn = ss(5.9, 6.6, t);
    setOp('icon', iconOn);
    const dim = ss(10.6, 15.6, t);
    $('envelope').setAttribute('stroke', `rgb(${lerp(127,48,dim)|0},${lerp(135,52,dim)|0},${lerp(150,60,dim)|0})`);
    setOp('aGlow', iconOn * (1 - .85*dim));
    setOp('iconNote', win(t, 6.6, 10.4, .5, .6));
    setOp('iconTear', win(t, 15.9, 16.9, .25, .6));
    // 光标：靠近，停在一秒之外
    const cx = lerp(1260, 1105, ss(8.5, 9.6, t)), cy = lerp(700, 560, ss(8.5, 9.6, t));
    $('cursor').setAttribute('transform', `translate(${cx} ${cy})`);
    setOp('cursor', win(t, 8.5, 11.2, .3, .6));
    $('bg').style.filter = `brightness(${(1 - .35*ss(10.6, 16.5, t)).toFixed(3)})`;
  }

  // ===== 片名（17.05 – 22.2）=====
  const T = t >= DROP - .02 && t < 22.4;
  const flash = t >= DROP ? Math.exp(-(t - DROP) / .09) : 0;
  $('flash').style.opacity = (t >= DROP && t < DROP + .8 ? clamp(flash * 1.1) : 0).toFixed(3);
  if (T) {
    $('bg').style.filter = 'brightness(.7)';
    const k = t - DROP, out = 1 - ss(21.6, 22.3, t);
    const glow = 6 + 40 * Math.exp(-k / .45);
    $('title').style.opacity = (out).toFixed(3);
    $('title').style.filter = `drop-shadow(0 0 ${glow*0.15+5}px rgba(220,232,255,.85)) drop-shadow(0 0 ${glow}px rgba(180,200,255,${(.35 + .4*Math.exp(-k/.45)).toFixed(2)}))`;
    $('titleEn').style.opacity = (ss(17.5, 18.1, t) * out).toFixed(3);
    setOp('rings', out);
    for (let i = 0; i < 5; i++) {
      const e = $('ring' + i), g = ss(17.05 + i*.08, 17.9 + i*.12, t);
      e.setAttribute('transform', `translate(960 600) scale(${(.35 + .65*g).toFixed(3)}) translate(-960 -600)`);
      e.setAttribute('stroke-opacity', (.12 * g + .25*Math.exp(-k/.3)*(1-i/5)).toFixed(3));
    }
  } else {
    $('title').style.opacity = 0; $('titleEn').style.opacity = 0; setOp('rings', 0);
  }

  // ===== B：箱子（22.2 – 37.2）=====
  const Bv = win(t, 22.2, 37.2, .8, .5);
  setOp('B', Bv);
  if (Bv > 0) {
    $('bg').style.filter = 'brightness(.85)';
    const z = ss(34.6, 37.0, t);   // 推近到那只狗
    const s = 1 + .03*ss(22.2, 34.6, t) + .55*z;
    const fx = lerp(960, 620, z), fy = lerp(560, 660, z);
    $('Bcam').setAttribute('transform', `translate(${fx} ${fy}) scale(${s}) translate(${-fx} ${-fy})`);
    setOp('bLabel', win(t, 22.6, 32.2, .6, .6));
    setOp('bDog1', ss(25.0, 25.8, t)); setOp('bDog2', ss(25.3, 26.1, t));
    setOp('bBar', ss(27.4, 28.0, t));
    setOp('bPool', ss(27.6, 28.6, t));
    const arc = ss(27.8, 29.2, t);
    $('bArc').setAttribute('opacity', (arc * (1 - .7*ss(30.0, 31.0, t))).toFixed(3));
    $('bArc').setAttribute('stroke-dashoffset', (-(t*20) % 14).toFixed(1));
    setOp('bArcTxt', win(t, 28.6, 31.2, .4, .5));
    // 地板一下一下地带电
    const pulse = (t > 30.1 && t < 32.2) ? Math.pow(Math.abs(Math.sin((t - 30.1) * Math.PI * 1.6)), 3) : 0;
    setOp('shockFloor', pulse * .9);
    setOp('bTag', win(t, 32.5, 34.8, .3, .4));
    setOp('bQ', win(t, 35.2, 37.2, .4, .3));
  }

  // ===== C：三只狗（37.2 – 62）=====
  const Cv = ss(37.2, 37.9, t);
  setOp('C', Cv);
  if (Cv > 0) {
    $('bg').style.filter = 'brightness(1)';
    const L = [350, 600, 850];
    // 第二天起才有栏杆
    const barUp = ss(47.8, 48.6, t);
    ['bar1','bar2','bar3'].forEach((id, i) => { const y0 = L[i]; $(id).setAttribute('y2', (y0 - 68*barUp).toFixed(1)); $(id).setAttribute('opacity', barUp.toFixed(2)); });
    // 狗的位置
    const jump = (t0) => { const x = ss(t0, t0 + 1.1, t); return { x: lerp(640, 1260, x), lift: Math.sin(Math.PI * x) * 135 }; };
    const nudge = (ts) => ts.reduce((a, t0) => a + 10 * win(t, t0, t0 + .35, .12, .2), 0);
    const j1 = jump(50.1), j3 = jump(50.5);
    const n1 = nudge([40.5]), n2 = nudge([43.1, 43.9, 44.7]);
    use('cDog1', j1.x + n1, L[0] - j1.lift);
    use('cDog3', j3.x, L[2] - j3.lift);
    use('cDog2s', 640 + n2, L[1]);
    use('cDog2l', 640, L[1], 1.25, 1.25);
    const lie = ss(52.4, 53.2, t);
    setOp('cDog2s', 1 - lie); setOp('cDog2l', lie);
    $('dot1').setAttribute('cx', j1.x + n1 + 40); $('dot1').setAttribute('cy', L[0] - j1.lift - 55);
    $('dot3').setAttribute('cx', j3.x + 40);      $('dot3').setAttribute('cy', L[2] - j3.lift - 55);
    $('dot2').setAttribute('cx', lerp(640 + n2 + 40, 690, lie)); $('dot2').setAttribute('cy', lerp(L[1] - 55, L[1] - 22, lie));
    $('dot2').setAttribute('opacity', (1 - lie).toFixed(3));
    // 弧线
    setOp('arc1', ss(50.1, 50.9, t) * (1 - .4*ss(55, 56, t)));
    setOp('arc3', ss(50.5, 51.3, t) * (1 - .4*ss(55, 56, t)));
    $('arc1').setAttribute('stroke-dashoffset', (-(t*20) % 14).toFixed(1));
    $('arc3').setAttribute('stroke-dashoffset', (-(t*20) % 14).toFixed(1));
    // 面板和电
    const before = 1 - ss(47.4, 47.9, t);
    setOp('panels', before);
    $('panel1').setAttribute('fill', t > 40.6 ? '#f2cf85' : '#2a2e36');
    setOp('wire2', ss(42.6, 43.0, t));
    const flick = 0.75 + 0.25 * Math.sin(t * 40);
    setOp('bolt1', win(t, 39.6, 41.0, .2, .3) * flick);
    setOp('cross1', win(t, 40.7, 42.2, .2, .4));
    setOp('bolt2', ss(42.6, 42.9, t) * before * flick);
    // 标注
    setOp('lab1', ss(39.6, 40.2, t)); setOp('labE1', ss(39.9, 40.5, t));
    setOp('lab2', ss(42.6, 43.2, t)); setOp('labE2', ss(42.9, 43.5, t));
    setOp('lab3', ss(45.5, 46.1, t)); setOp('labE3', ss(45.8, 46.4, t));
    setOp('next', win(t, 47.6, 52.0, .5, .6));
    setOp('brace', ss(54.8, 55.5, t));
  }

  // 大字：做什么，都没用
  const BIG = '做什么，都没用', B0 = 59.0;
  const big = $('big');
  if (!big.children.length) big.innerHTML = [...BIG].map(c => `<span>${c}</span>`).join('');
  const bigOut = 1 - ss(62.6, 63.3, t);
  const shake = t > B0 ? 3 * Math.exp(-(t - B0) / .25) * Math.sin(t * 90) : 0;
  big.style.transform = `translateX(${shake.toFixed(2)}px)`;
  [...big.children].forEach((sp, i) => {
    const t0 = B0 + i * .11, x = ss(t0, t0 + .22, t);
    const land = t > t0 + .18 ? Math.exp(-(t - t0 - .18) / .35) : 0;
    sp.style.opacity = (x * bigOut).toFixed(3);
    sp.style.transform = `scale(${(1.3 - .3 * x).toFixed(3)})`;
    sp.style.filter = `blur(${((1 - x) * 14).toFixed(1)}px)`;
    sp.style.textShadow = `0 0 ${(18 + 40 * land).toFixed(0)}px rgba(170,195,255,${(.35 + .45 * land).toFixed(2)}), 0 3px 8px rgba(0,0,0,.9)`;
  });
  if (Cv > 0) setOp('C', Cv * (1 - .75 * ss(58.7, 59.4, t)));
  // 字幕
  renderSub(t, $('sub'), PARSED);
  if (t >= 17.5 && t < 22.4) {
    $('sub').style.bottom = '300px';
    renderSub(t, $('sub'), Q);
  } else $('sub').style.bottom = '58px';
  // 结尾淡出
  $('fade').style.opacity = ss(63.0, 63.8, t).toFixed(3);
};
</script>
