<style>

  html,body { width:1920px; height:1080px; overflow:hidden; background:#060709; }

  svg#stage { position:absolute; inset:0; }
  #sub { position:absolute; left:0; right:0; bottom:58px; text-align:center; white-space:pre;
    font: 900 54px 'Noto Serif SC', serif; color:#ece8df; letter-spacing:2px;
    text-shadow: 0 0 18px rgba(255,240,210,.16), 0 2px 6px rgba(0,0,0,.85); }
  #sub span { display:inline-block; }
  #sub span.k { color:#f2cf85; text-shadow: 0 0 22px rgba(242,207,133,.45), 0 2px 6px rgba(0,0,0,.85); }
  #title { position:absolute; top:262px; width:100%; text-align:center; font:900 300px/1.2 'Noto Serif SC'; letter-spacing:40px; padding-left:40px;
    background:linear-gradient(180deg,#ffffff 0%,#e3e9f4 45%,#9aa6ba 58%,#f4f7fc 100%); -webkit-background-clip:text; color:transparent; opacity:0; }
  #titleEn { position:absolute; top:238px; width:100%; text-align:center; color:#9aa0aa; font:500 20px 'JetBrains Mono'; letter-spacing:6px; opacity:0; }
  #flash { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%, #ffffff 0%, #e9edf3 60%, #c8ccd4 100%); opacity:0; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; }
  #vig { position:absolute; inset:0; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  canvas#grain { position:absolute; inset:0; opacity:.05; mix-blend-mode:screen; }
  #big { position:absolute; top:430px; width:100%; text-align:center; white-space:pre; font:900 150px 'Noto Serif SC'; letter-spacing:12px; color:#e4e8ef; }
  #big span { display:inline-block; }
  .mono { font-family:'JetBrains Mono', monospace; }
  .sans { font-family:'Noto Sans SC', sans-serif; font-weight:500; }
</style></head>

    <g id="dogLie">

    </g>

    <circle id="dot1" r="6" fill="#fff3d1" filter="url(#glow)"/>

      <text x="512" y="420" fill="#d8dde6" class="sans" font-size="22">挨的疼</text>

    const lit = ss(147.9, 148.8, t);
    $('iEnv').setAttribute('stroke', `rgb(${lerp(58,200,lit)|0},${lerp(63,214,lit)|0},${lerp(75,240,lit)|0})`);
    setOp('iGlow', lit);
    setOp('iEmpty', ss(148.8, 149.3, t));
    setOp('iIcon', 1 - ss(149.8, 150.2, t));
    STEPS.forEach(s => s.el.setAttribute('opacity', (ss(s.t, s.t + .2, t) * (1 - ss(146.8, 147.6, t)) * .8).toFixed(3)));
    setOp('iT1', win(t, 142.6, 147.6, .3, .6)); setOp('iT2', win(t, 143.4, 147.6, .3, .6));
    setOp('iCompose', win(t, 150.0, 151.5, .3, .4));
    $('iSend').setAttribute('transform', `translate(1256 621) scale(${1 - .06 * win(t, 150.6, 150.9, .1, .15)}) translate(-1256 -621)`);
    setOp('iToast', win(t, 151.0, 152.3, .25, .4));
  }

  // ===== J：陪他跨过去（152.0 – 156.3）=====
  const Jv = win(t, 152.0, 156.4, .7, .5);
  setOp('J', Jv);
  if (Jv > 0) {
    $('bg').style.filter = 'brightness(1)';
    const s = 1 + .04 * ss(152, 156.4, t);
    $('J').setAttribute('transform', `translate(960 600) scale(${s}) translate(-960 -600)`);
  }

  // ===== 片尾（156 – 159.75）=====
  setOp('END', ss(156.1, 156.9, t));

  // 右上角“有用”计数
  setOp('useCtr', win(t, 119.6, 152.3, .5, .4));
  $('useNum').textContent = USE_AT.filter(x => t >= x).length;

  // 大字
  const big = $('big');
  const B = BIGS.find(b => t >= b.t0 - .05 && t < b.t1 + .1);
  if (!B) { big.innerHTML = ''; big._b = null; }
  else {
    if (big._b !== B) { big.innerHTML = [...B.text].map(c => `<span>${c}</span>`).join(''); big.style.fontSize = B.size + 'px'; big._b = B; }
    const bigOut = 1 - ss(B.t1 - .7, B.t1, t);
    const shake = t > B.t0 ? 3 * Math.exp(-(t - B.t0) / .25) * Math.sin(t * 90) : 0;
    big.style.transform = `translateX(${shake.toFixed(2)}px)`;
    [...big.children].forEach((sp, i) => {
      const t0 = B.t0 + i * .09, x = ss(t0, t0 + .22, t);
      const land = t > t0 + .18 ? Math.exp(-(t - t0 - .18) / .35) : 0;
      sp.style.opacity = (x * bigOut).toFixed(3);
      sp.style.transform = `scale(${(1.3 - .3 * x).toFixed(3)})`;
      sp.style.filter = `blur(${((1 - x) * 14).toFixed(1)}px)`;
      sp.style.textShadow = `0 0 ${(18 + 40 * land).toFixed(0)}px rgba(${B.t0 > 100 ? '242,207,133' : '170,195,255'},${(.35 + .45 * land).toFixed(2)}), 0 3px 8px rgba(0,0,0,.9)`;
    });
  }
  if (Cv > 0) setOp('C', Cv * (1 - .75 * ss(58.7, 59.4, t)) * (1 - ss(63.0, 63.6, t)));
  // 字幕
  renderSub(t, $('sub'), PARSED);
  if (t >= 17.5 && t < 22.4) {
    $('sub').style.bottom = '300px';
    renderSub(t, $('sub'), Q);
  } else $('sub').style.bottom = '58px';
  // 结尾淡出
  $('fade').style.opacity = ss(159.0, 159.75, t).toFixed(3);
};
</script>
</body></html>
