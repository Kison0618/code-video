<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/500.css">
<style>
  :root { --gold:#f2cf85; --silver:#dfe6f2; --dim:#5d6676; --ink:#121318; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#07080a; }
  .frame { position:absolute; inset:0; display:none;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, #1b1d23 0%, #0e0f13 55%, #060709 100%); }
  .frame.on { display:block; }
  .sub { position:absolute; left:0; right:0; bottom:58px; text-align:center;
    font: 900 54px 'Noto Serif SC', serif; color:#ece8df; letter-spacing:2px;
    text-shadow: 0 0 18px rgba(255,240,210,.18), 0 2px 6px rgba(0,0,0,.8); }
  .sub b { color: var(--gold); font-weight:900; text-shadow: 0 0 22px rgba(242,207,133,.45); }
  .mono { font-family:'JetBrains Mono', monospace; }
  svg { position:absolute; inset:0; }
  .dust circle { fill:#fff; }
</style></head>
<body>

<!-- 1 · 冷开场：不再点开的邮箱 -->
<div class="frame" id="f1">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8fb4ff" stop-opacity=".16"/><stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="iconFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#23262e"/><stop offset="1" stop-color="#16181d"/>
      </linearGradient>
    </defs>
    <g class="dust" opacity=".35">
      <circle cx="420" cy="260" r="1.6"/><circle cx="1490" cy="330" r="1.2"/><circle cx="1260" cy="190" r="1"/>
      <circle cx="610" cy="640" r="1.2"/><circle cx="1610" cy="700" r="1.4"/>
    </g>
    <circle cx="960" cy="470" r="330" fill="url(#iconGlow)"/>
    <!-- 邮箱图标 -->
    <rect x="845" y="355" width="230" height="230" rx="54" fill="url(#iconFill)" stroke="#3a3f4b" stroke-width="2"/>
    <g fill="none" stroke="#7f8796" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".75">
      <rect x="895" y="420" width="130" height="96" rx="12"/>
      <path d="M899 428 L960 476 L1021 428"/>
    </g>
    <text x="960" y="640" text-anchor="middle" fill="#8a909c" font-family="Noto Sans SC" font-size="28" font-weight="500">邮箱</text>
    <!-- 标注 -->
    <g stroke="#6c7482" stroke-width="1.5" fill="none" opacity=".9">
      <path d="M1075 380 L1180 300 L1420 300"/>
    </g>
    <circle cx="1075" cy="380" r="4" fill="#9aa3b2"/>
    <text x="1190" y="288" fill="#c9ced8" class="mono" font-size="22" letter-spacing="1">上次打开 · 6 天前</text>
    <text x="1190" y="330" fill="#6c7482" class="mono" font-size="16" letter-spacing="3">LAST OPENED · 6 DAYS AGO</text>
    <!-- 右上角计数 -->
    <text x="1840" y="92" text-anchor="end" fill="#e9e3d2" class="mono" font-size="44" font-weight="500" letter-spacing="2">30</text>
    <text x="1840" y="122" text-anchor="end" fill="#7c8391" font-family="Noto Sans SC" font-size="18">已投出的简历</text>
    <text x="1840" y="190" text-anchor="end" fill="#e07a6a" class="mono" font-size="44" font-weight="500">0</text>
    <text x="1840" y="220" text-anchor="end" fill="#7c8391" font-family="Noto Sans SC" font-size="18">回复</text>
  </svg>
  <div class="sub">后来，他连邮箱，<b>都不点开了</b>。</div>
</div>

<!-- 2 · 片名 -->
<div class="frame" id="f2" style="background:radial-gradient(ellipse 60% 50% at 50% 50%, #121318 0%, #060608 100%)">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <g fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5">
      <ellipse cx="960" cy="600" rx="230" ry="44"/><ellipse cx="960" cy="600" rx="420" ry="82"/>
      <ellipse cx="960" cy="600" rx="620" ry="122"/><ellipse cx="960" cy="600" rx="860" ry="170"/>
      <ellipse cx="960" cy="600" rx="1120" ry="222"/>
    </g>
  </svg>
  <div class="mono" style="position:absolute;top:238px;width:100%;text-align:center;color:#9aa0aa;font-size:20px;letter-spacing:6px">LEARNED HELPLESSNESS</div>
  <div style="position:absolute;top:262px;width:100%;text-align:center;font:900 300px/1.2 'Noto Serif SC';letter-spacing:40px;padding-left:40px;
    background:linear-gradient(180deg,#ffffff 0%,#e3e9f4 45%,#9aa6ba 58%,#f4f7fc 100%);-webkit-background-clip:text;color:transparent;
    filter:drop-shadow(0 0 6px rgba(220,232,255,.8)) drop-shadow(0 0 30px rgba(180,200,255,.35))">无助</div>
  <div class="sub" style="bottom:300px">一个人，是怎么<b>学会放弃</b>的？</div>
</div>

<!-- 3 · 三只狗 -->
<div class="frame" id="f3">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <g id="dogStand">
        <rect x="-60" y="-78" width="112" height="38" rx="19"/>
        <path d="M30 -74 L52 -104 L74 -96 L54 -50 Z"/>
        <circle cx="68" cy="-104" r="17"/>
        <rect x="74" y="-107" width="25" height="14" rx="7"/>
        <path d="M56 -116 L63 -134 L73 -114 Z"/>
        <rect x="-54" y="-48" width="12" height="48" rx="6"/><rect x="-36" y="-48" width="12" height="48" rx="6"/>
        <rect x="26" y="-48" width="12" height="48" rx="6"/><rect x="40" y="-48" width="12" height="48" rx="6"/>
        <path d="M-56 -70 Q-86 -82 -84 -108" fill="none" stroke="#121318" stroke-width="10" stroke-linecap="round"/>
      </g>
      <g id="dogLie">
        <rect x="-62" y="-34" width="118" height="30" rx="15"/>
        <circle cx="70" cy="-17" r="16"/>
        <rect x="74" y="-15" width="24" height="12" rx="6"/>
        <path d="M58 -28 L52 -8 L66 -12 Z"/>
        <rect x="46" y="-8" width="58" height="8" rx="4"/>
        <path d="M-60 -10 Q-84 -4 -100 -12" fill="none" stroke="#121318" stroke-width="9" stroke-linecap="round"/>
      </g>
      <filter id="rimGold" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
        <feFlood flood-color="#f2cf85"/><feComposite in2="d" operator="in" result="edge"/>
        <feGaussianBlur in="edge" stdDeviation="9" result="soft"/>
        <feMerge><feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rimSilver" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
        <feFlood flood-color="#dfe8f6"/><feComposite in2="d" operator="in" result="edge"/>
        <feGaussianBlur in="edge" stdDeviation="9" result="soft"/>
        <feMerge><feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rimDim" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
        <feFlood flood-color="#5d6676"/><feComposite in2="d" operator="in" result="edge"/>
        <feGaussianBlur in="edge" stdDeviation="5" result="soft"/>
        <feMerge><feMergeNode in="soft"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 三条跑道 -->
    <g stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5">
      <line x1="120" y1="350" x2="1800" y2="350"/><line x1="120" y1="600" x2="1800" y2="600"/><line x1="120" y1="850" x2="1800" y2="850"/>
    </g>
    <g class="mono" fill="#6f7685" font-size="22">
      <text x="1820" y="342">1</text><text x="1820" y="592">2</text><text x="1820" y="842">3</text>
    </g>
    <!-- 栏杆 -->
    <g stroke-linecap="round" filter="url(#glow)">
      <line x1="960" y1="350" x2="960" y2="282" stroke="#e8edf5" stroke-width="5"/>
      <line x1="960" y1="600" x2="960" y2="532" stroke="#e8edf5" stroke-width="5"/>
      <line x1="960" y1="850" x2="960" y2="782" stroke="#e8edf5" stroke-width="5"/>
    </g>
    <!-- 跳跃弧线 -->
    <g fill="none" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" filter="url(#glow)">
      <path d="M760 300 Q960 120 1170 300" stroke="#f2cf85"/>
      <path d="M760 800 Q960 620 1170 800" stroke="#dfe8f6" stroke-opacity=".8"/>
    </g>

    <!-- 狗 -->
    <g fill="#121318">
      <use href="#dogStand" transform="translate(1260 350)" filter="url(#rimGold)"/>
      <use href="#dogLie" transform="translate(700 600) scale(1.25)" filter="url(#rimDim)"/>
      <use href="#dogStand" transform="translate(1260 850)" filter="url(#rimSilver)"/>
    </g>
    <circle cx="1300" cy="295" r="6" fill="#fff3d1" filter="url(#glow)"/>
    <circle cx="1300" cy="795" r="6" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="745" cy="578" r="5" fill="#4a5160"/>

    <!-- 左侧标注 -->
    <g font-family="Noto Sans SC" font-size="24" font-weight="500">
      <text x="160" y="300" fill="#f2cf85">推一下，电就停</text>
      <text x="160" y="550" fill="#8b93a2">怎么推，都不停</text>
      <text x="160" y="800" fill="#c9d1de">没挨电</text>
    </g>
    <g class="mono" font-size="15" letter-spacing="2" fill="#5f6675">
      <text x="160" y="328">CAN STOP IT</text><text x="160" y="578">CAN'T STOP IT</text><text x="160" y="828">NO SHOCK</text>
    </g>
    <!-- 一样多的疼 -->
    <g stroke="#a7afbd" stroke-width="1.5" fill="none" opacity=".9">
      <path d="M470 290 L480 290 L480 560 L470 560"/>
      <path d="M480 425 L500 425"/>
    </g>
    <text x="512" y="420" fill="#d8dde6" font-family="Noto Sans SC" font-size="22" font-weight="500">挨的疼</text>
    <text x="512" y="452" fill="#d8dde6" font-family="Noto Sans SC" font-size="22" font-weight="500">一样多</text>
  </svg>
  <div class="sub">它们只差一样东西——<b>有没有用</b>。</div>
</div>

<!-- 4 · 结尾：陪他跨过去一次 -->
<div class="frame" id="f4">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff2d0" stop-opacity=".0"/><stop offset=".35" stop-color="#fff2d0" stop-opacity=".07"/><stop offset="1" stop-color="#fff2d0" stop-opacity=".13"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1b20"/><stop offset="1" stop-color="#08090b"/>
      </linearGradient>
      <filter id="rimG" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="d"/>
        <feFlood flood-color="#f2cf85"/><feComposite in2="d" operator="in" result="edge"/>
        <feGaussianBlur in="edge" stdDeviation="11" result="soft"/>
        <feMerge><feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rimS" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="d"/>
        <feFlood flood-color="#dfe8f6"/><feComposite in2="d" operator="in" result="edge"/>
        <feGaussianBlur in="edge" stdDeviation="11" result="soft"/>
        <feMerge><feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow2" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
        <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <polygon points="700,0 1220,0 1460,760 460,760" fill="url(#cone)"/>
    <rect x="0" y="760" width="1920" height="320" fill="url(#floor)"/>
    <line x1="0" y1="760" x2="1920" y2="760" stroke="#ffffff" stroke-opacity=".08"/>
    <g class="dust" opacity=".5">
      <circle cx="820" cy="210" r="1.6"/><circle cx="1080" cy="330" r="1.2"/><circle cx="960" cy="140" r="1"/><circle cx="1180" cy="520" r="1.3"/><circle cx="760" cy="460" r="1"/>
    </g>
    <!-- 栏杆 -->

    <!-- 左边的人（银）：正抬腿跨过 -->
    <g fill="#121318" stroke="#121318" stroke-linecap="round" filter="url(#rimS)">
      <circle cx="850" cy="470" r="27" stroke="none"/>
      <rect x="822" y="506" width="56" height="128" rx="22" stroke="none"/>
      <line x1="838" y1="626" x2="815" y2="752" stroke-width="24"/>
      <path d="M864 626 L945 606 L1004 652" fill="none" stroke-width="24" stroke-linejoin="round"/>
      <line x1="830" y1="520" x2="800" y2="610" stroke-width="20"/>
      <line x1="872" y1="522" x2="960" y2="560" stroke-width="20"/>
    </g>
    <!-- 右边的人（金）：已经过去，回头伸手 -->
    <g fill="#121318" stroke="#121318" stroke-linecap="round" filter="url(#rimG)">
      <circle cx="1080" cy="462" r="27" stroke="none"/>
      <rect x="1052" y="498" width="56" height="134" rx="22" stroke="none"/>
      <line x1="1066" y1="624" x2="1050" y2="752" stroke-width="24"/>
      <line x1="1094" y1="624" x2="1118" y2="752" stroke-width="24"/>
      <line x1="1058" y1="516" x2="975" y2="556" stroke-width="20"/>
      <line x1="1102" y1="520" x2="1128" y2="608" stroke-width="20"/>
    </g>
    <g stroke="#eef2f8" stroke-linecap="round" filter="url(#glow2)">
      <line x1="915" y1="700" x2="1005" y2="700" stroke-width="6"/>
      <line x1="922" y1="700" x2="922" y2="760" stroke-width="4" stroke-opacity=".7"/>
      <line x1="998" y1="700" x2="998" y2="760" stroke-width="4" stroke-opacity=".7"/>
    </g>
    <!-- 牵着的手：一点光 -->
    <circle cx="967" cy="558" r="9" fill="#fff6e0" filter="url(#glow2)"/>
    <circle cx="850" cy="560" r="6" fill="#ffffff" filter="url(#glow2)" opacity=".9"/>
    <circle cx="1080" cy="552" r="6" fill="#fff3d1" filter="url(#glow2)"/>
    <!-- 标注 -->
    <g stroke="#7c8392" stroke-width="1.5" fill="none"><path d="M960 770 L960 820"/></g>
    <text x="960" y="856" text-anchor="middle" fill="#aab1bd" class="mono" font-size="18" letter-spacing="2">一道矮栏杆</text>
  </svg>
  <div class="sub">别催他跳。<b>陪他，跨过去一次</b>。</div>
</div>

<script>
  const f = new URLSearchParams(location.search).get('f') || '1';
  document.getElementById('f' + f).classList.add('on');
</script>
</body></html>
